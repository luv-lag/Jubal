[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jubal"
version = "0.1.0"
description = "Wake word + voice-ID gate + ASR/TTS glue (sherpa-onnx), orchestrated with Pipecat, exposed over MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
sherpa = ["sherpa-onnx>=1.10"]
prototype = ["resemblyzer>=0.1.4"]
realtime = ["pipecat-ai>=0.0.50", "sherpa-onnx>=1.10", "sounddevice>=0.4"]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["jubal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
